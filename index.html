      { id: 'flower_1', icon: '🌻' },
      { id: 'tree_1', icon: '🌳' },
      { id: 'blossom_1', icon: '🌸' }
    ];

    // --- 2. 輔助運算與工具函式 ---
    function calcAge(birthdayStr) {
      if (!birthdayStr) return 25;
      const birth = new Date(birthdayStr);
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      const m = today.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
      return age > 0 ? age : 1;
    }

    function calcBMR(gender, weight, height, age) {
      const w = parseFloat(weight) || 60;
      const h = parseFloat(height) || 165;
      const a = parseInt(age, 10) || 25;
      if (gender === 'male') {
        return Math.round(10 * w + 6.25 * h - 5 * a + 5);
      } else {
        return Math.round(10 * w + 6.25 * h - 5 * a - 161);
      }
    }

    function calcBaseline(bmr, activityFactor) {
      return Math.round(bmr * (activityFactor || 1.2));
    }
    
    function estimateKcalFromName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) {
        hash = name.charCodeAt(i) + ((hash << 5) - hash);
      }
      return Math.abs(hash % 650) + 120;
    }

    function getWarningMessage(deficit) {
        if (deficit >= 1000) {
            return { type: 'deficit', text: '⚠️ 警告：熱量赤字過大！請確保攝取足夠營養，避免過度節食或運動過量造成身體負擔。' };
        } else if (deficit <= -1000) {
            return { type: 'surplus', text: '⚠️ 注意：熱量大幅超標！請注意飲食份量，並試著多增加一些運動來平衡喔！' };
        }
        return null;
    }

    // --- 3. 漂浮並彈跳的全螢幕背景 Canvas 元件 (密度增加3倍，全螢幕邊界碰撞彈回) ---
    function BouncingBackgroundCanvas() {
        const canvasRef = useRef(null);

        useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let animationFrameId;

            const resizeCanvas = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 種類更豐富的花苗草木果實 icon
            const iconList = [
                '🌱', '🌿', '🍀', '🌻', '🌸', '🌼', '🍃', '🌷', '🍄', '🍁', '🍂', 
                '🌹', '🌾', '🌺', '🌵', '🌴', '🌲', '🌳', '🪴', '🎋', '🍇', '🍓', 
                '🍎', '🍋', '🥑', '🥦', '🌽', '🥕', '🍏', '🫐', '🍒', '🥝'
            ];

            // 增加至 85 個左右（密度增加約 3 倍）
            const particlesCount = 85;
            const particles = [];

            for (let i = 0; i < particlesCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 1.6, // 飄動速度 X
                    vy: (Math.random() - 0.5) * 1.6, // 飄動速度 Y
                    size: 20 + Math.random() * 26,   // 大小
                    angle: Math.random() * Math.PI * 2,
                    vAngle: (Math.random() - 0.5) * 0.025, // 旋轉角速度
                    icon: iconList[Math.floor(Math.random() * iconList.length)],
                    opacity: 0.12 + Math.random() * 0.18 // 柔和透明度
                });
            }

            const render = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.vAngle;

                    // 螢幕邊界碰撞彈回效果 (Bounce off walls)
                    if (p.x <= 15) {
                        p.x = 15;
                        p.vx = -p.vx;
                    } else if (p.x >= canvas.width - 25) {
                        p.x = canvas.width - 25;
                        p.vx = -p.vx;
                    }

                    if (p.y <= 25) {
                        p.y = 25;
                        p.vy = -p.vy;
                    } else if (p.y >= canvas.height - 15) {
                        p.y = canvas.height - 15;
                        p.vy = -p.vy;
                    }

                    // 繪製旋轉 icon
                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    ctx.font = `${p.size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.fillText(p.icon, 0, 0);
                    ctx.restore();
                }

                animationFrameId = requestAnimationFrame(render);
            };

            render();

            return () => {
                window.removeEventListener('resize', resizeCanvas);
                cancelAnimationFrame(animationFrameId);
            };
        }, []);

        return (
            <canvas 
                ref={canvasRef} 
                className="fixed inset-0 pointer-events-none z-0 w-full h-full"
            />
        );
    }

    // --- 4. 主要應用元件 App ---

      const [globalError, setGlobalError] = useState(null);

      const [activeDate, setActiveDate] = useState(null);
      const [isRecordModalOpen, setIsRecordModalOpen] = useState(false);
      const [isDetailPopoverOpen, setIsDetailPopoverOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isRebirthModalOpen, setIsRebirthModalOpen] = useState(false);
      const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
      const [isAvatarMenuOpen, setIsAvatarMenuOpen] = useState(false);

      useEffect(() => {
        try {
          const savedProfile = localStorage.getItem(STORAGE_KEYS.PROFILE);
          const savedRecords = localStorage.getItem(STORAGE_KEYS.RECORDS);
          if (savedProfile) {
            setProfile(JSON.parse(savedProfile));
          } else {
            setShowSplash(true);
          }
          if (savedRecords) {
            setRecords(JSON.parse(savedRecords));
          }
          setIsInitialized(true);
        } catch (err) {
          console.error(err);
          setGlobalError("讀取本機資料時發生錯誤，可能是儲存空間限制或格式異常。");
        }
      }, []);

      const handleSaveProfile = (newProfile) => {
        try {
          localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(newProfile));
          setShowSplash(false);
          setIsProfileModalOpen(false);
          setIsAvatarMenuOpen(false);
          
          if (!profile) {
            setShowTransition(true);
            setTimeout(() => {
              setProfile(newProfile);
              setShowTransition(false);
            }, 3000);
          } else {
            setProfile(newProfile);
          }
        } catch (err) {
          setGlobalError("儲存個人設定失敗！請確認瀏覽器未開啟完全阻擋儲存模式。");
        }
      };

      const handleSaveDayRecord = (dateKey, foodItems, exerciseItems) => {
        if (foodItems.length === 0 && exerciseItems.length === 0) {
            setIsRecordModalOpen(false);
            return;
        }

        try {
          const totalIntake = foodItems.reduce((sum, item) => sum + (parseFloat(item.totalKcal) || 0), 0);
          const totalBurn = exerciseItems.reduce((sum, item) => sum + (parseFloat(item.burnKcal) || 0), 0);
          const baseline = profile ? profile.baseline : 1500;
          const deficit = Math.round((baseline + totalBurn) - totalIntake);
          const isSuccess = deficit >= 0;

          const updatedDay = {
            foods: foodItems,
            exercises: exerciseItems,
            summary: {
              intake: Math.round(totalIntake),
              burn: Math.round(totalBurn),
              deficit,
              isSuccess
            }
          };

          const newRecords = { ...records, [dateKey]: updatedDay };
          localStorage.setItem(STORAGE_KEYS.RECORDS, JSON.stringify(newRecords));
          setRecords(newRecords);
          setIsRecordModalOpen(false);

          if (isSuccess && deficit < 1000 && window.confetti) {
            window.confetti({
              particleCount: 50,
              spread: 60,
              origin: { y: 0.6 },
              colors: ['#22c55e', '#86efac', '#15803d', '#facc15']
            });
          }
        } catch (err) {
          setGlobalError("儲存當日紀錄失敗！請點擊重試以重新整理。");
        }
      };

      const handleDeleteDayRecord = (dateKey) => {
        try {
          const newRecords = { ...records };
          delete newRecords[dateKey];
          localStorage.setItem(STORAGE_KEYS.RECORDS, JSON.stringify(newRecords));
          setRecords(newRecords);
          setIsDeleteModalOpen(false);
          setIsDetailPopoverOpen(false);
        } catch (err) {
          setGlobalError("刪除紀錄失敗！請點擊重試。");
        }
      };

      const handleRebirth = () => {
        try {
          localStorage.removeItem(STORAGE_KEYS.PROFILE);
          localStorage.removeItem(STORAGE_KEYS.RECORDS);
          setProfile(null);
          setRecords({});
          setIsRebirthModalOpen(false);
          setIsDetailPopoverOpen(false);
          setIsRecordModalOpen(false);
          setIsAvatarMenuOpen(false);
          setShowSplash(true);

          setGlobalError("重置失敗！請點擊重試重整頁面。");

          <BouncingBackgroundCanvas />

          <div className="max-w-5xl mx-auto px-4 py-6 md:py-8 relative z-10">

                  setIsRecordModalOpen(true);

            {isRecordModalOpen && activeDate && (
              <RecordModal

                initialRecord={records[activeDate]}

                baseline={profile.baseline}

              />
            )}

            {/* 編輯個人資料 Modal */}
            {isProfileModalOpen && (
              <ProfileEditModal 
                initialProfile={profile}
                onClose={() => setIsProfileModalOpen(false)}
                onSave={handleSaveProfile}
              />

            {/* 大頭貼編輯選單 */}
            {isAvatarMenuOpen && (
              <AvatarEditModal
                currentProfile={profile}
                onClose={() => setIsAvatarMenuOpen(false)}
                onSave={handleSaveProfile}
              />
            )}

            {/* 重新出生孟婆湯確認視窗 */}
            {isRebirthModalOpen && (
              <RebirthConfirmModal 
                onClose={() => setIsRebirthModalOpen(false)}
                onConfirm={handleRebirth}
              />
            )}

            {/* 單日紀錄刪除確認視窗 */}
            {isDeleteModalOpen && (
              <DeleteConfirmModal 
                dateKey={activeDate}
                onClose={() => setIsDeleteModalOpen(false)}
                onConfirm={() => handleDeleteDayRecord(activeDate)}
              />
            )}

            {/* 全域錯誤視窗 */}
            {globalError && (
              <GlobalErrorModal message={globalError} />
            )}

            {/* 主頁下方資訊欄：左下角重新出生，右下角免責聲明 */}
            <div className="mt-12 flex flex-col md:flex-row items-center justify-between gap-4">
              {/* 「重新出生」移至左下角，防呆不誤觸 */}
              <button 
                onClick={() => setIsRebirthModalOpen(true)} 
                title="重新出生 (清除所有資料)"
                className="flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-white/75 hover:bg-rose-50 border border-stone-200/80 hover:border-rose-300 text-stone-500 hover:text-rose-600 shadow-sm backdrop-blur-md transition-all group cursor-pointer text-xs md:text-sm font-bold"
              >
                <span className="text-xl group-hover:scale-125 transition-transform">👶</span>
                <span>重新出生</span>
              </button>

              {/* 右下角營養師免責聲明備註 */}
              <div className="text-center md:text-right">
                <span className="inline-block bg-white/80 backdrop-blur-sm border border-emerald-200/60 px-4 py-2 rounded-2xl text-xs text-stone-500 font-bold shadow-sm">
                  💡 本小工具僅供試算參考，不代表真正準確的數值，如有問題請諮詢專業營養師
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    }

      const [weight, setWeight] = useState('58');
      const [activityLevel, setActivityLevel] = useState('sedentary');
      
      const [avatarType, setAvatarType] = useState('sprout_1');
      const [avatarImage, setAvatarImage] = useState(null);
      const fileInputRef = useRef(null);

      // 動畫節奏控制

          const t3 = setTimeout(() => setInSplash(false), 5800);
          return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
        }

      const age = useMemo(() => calcAge(birthday), [birthday]);

        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAvatarImage(reader.result);
            setAvatarType('custom');
          };
          reader.readAsDataURL(file);
        }
      };

      const handleFinish = () => {
        const finalName = username.trim().slice(0, 10) || '綠寶好友';
        const bmr = calcBMR(gender, weight, height, age);
        const selectedAct = ACTIVITY_LEVELS.find(a => a.id === activityLevel) || ACTIVITY_LEVELS[0];
        const baseline = calcBaseline(bmr, selectedAct.factor);
        
        let finalAvatar = avatarType;
        if (avatarType === 'custom' && avatarImage) {
            finalAvatar = avatarImage;
        } else if (avatarType === 'custom' && !avatarImage) {
            finalAvatar = 'sprout_1';
        }

        onComplete({
          username: finalName,
          gender,
          birthday,
          age,
          height: parseFloat(height) || 165,
          weight: parseFloat(weight) || 60,
          activity: activityLevel,
          activityFactor: selectedAct.factor,
          bmr,
          baseline,
          avatar: finalAvatar

                    splashStage === 1

                 }`}>

                </p>

            </div>

                  <input

                  />

    // --- 9. 區塊二：互動式月曆 ---
    function CalendarView({ profile, records, onSelectDate }) {
      const [currentDate, setCurrentDate] = useState(new Date());

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const stats = useMemo(() => {
        let successCount = 0;
        let failCount = 0;
        Object.keys(records).forEach(key => {
          if (key.startsWith(`${year}-${String(month + 1).padStart(2, '0')}`)) {
            if (records[key].summary) {
              if (records[key].summary.isSuccess) successCount++;
              else failCount++;
            }
          }
        });
        return { successCount, failCount };
      }, [records, year, month]);

      const prevMonth = () => setCurrentDate(new Date(year, month - 1, 1));
      const nextMonth = () => setCurrentDate(new Date(year, month + 1, 1));

      const calendarCells = useMemo(() => {
        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = [];

        for (let i = 0; i < firstDayIndex; i++) {
          cells.push({ type: 'empty', key: `empty-${i}` });
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const record = records[dateKey];
          cells.push({
            type: 'day',
            day: d,
            dateKey,
            record
          });
        }
        return cells;
      }, [year, month, records]);

      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];

      return (
        <div className="bg-white/85 backdrop-blur-md rounded-[2rem] p-6 md:p-8 shadow-lg shadow-emerald-900/5 border border-white">
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
            <div className="flex items-center gap-2 bg-white p-1.5 rounded-2xl border border-stone-100 shadow-sm">
              <button 
                onClick={prevMonth} 
                className="p-2 md:px-4 md:py-2 rounded-xl bg-stone-50 hover:bg-emerald-50 text-stone-700 font-bold transition shadow-sm border border-stone-100"
              >
                ◀
              </button>
              <h2 className="text-xl md:text-2xl font-black text-emerald-900 min-w-[160px] text-center tracking-wide">
                {year} 年 {month + 1} 月
              </h2>
              <button 
                onClick={nextMonth} 
                className="p-2 md:px-4 md:py-2 rounded-xl bg-stone-50 hover:bg-emerald-50 text-stone-700 font-bold transition shadow-sm border border-stone-100"
              >
                ▶
              </button>
            </div>

            <div className="flex items-center gap-3 text-sm">
              <span className="flex items-center gap-2 bg-white text-emerald-800 px-4 py-2 rounded-2xl font-bold border border-emerald-100 shadow-sm">
                <span className="w-3 h-3 rounded-full bg-emerald-500 shadow-sm"></span> 
                達標：{stats.successCount} 天
              </span>
              <span className="flex items-center gap-2 bg-white text-rose-800 px-4 py-2 rounded-2xl font-bold border border-rose-100 shadow-sm">
                <span className="w-3 h-3 rounded-full bg-rose-500 shadow-sm"></span> 
                超標：{stats.failCount} 天
              </span>
            </div>
          </div>

          <div className="grid grid-cols-7 gap-2 mb-3 text-center text-sm font-black text-stone-400">
            {weekdays.map((w, idx) => (
              <div key={idx} className={idx === 0 || idx === 6 ? 'text-rose-400' : 'text-emerald-700'}>
                {w}
              </div>
            ))}
          </div>

          <div className="grid grid-cols-7 gap-2 md:gap-3">
            {calendarCells.map((cell) => {
              if (cell.type === 'empty') {
                return <div key={cell.key} className="h-24 md:h-28 rounded-2xl bg-transparent" />;
              }

              const hasRecord = !!cell.record && !!cell.record.summary;
              const isSuccess = hasRecord && cell.record.summary.isSuccess;
              const deficit = hasRecord ? cell.record.summary.deficit : 0;

              let bgStyle = "bg-white hover:bg-stone-50 text-stone-600 border border-dashed border-stone-200 shadow-sm";
              if (hasRecord) {
                if (isSuccess) {
                  bgStyle = "bg-gradient-to-br from-emerald-50 to-emerald-100 hover:from-emerald-100 hover:to-emerald-200 text-emerald-950 border-2 border-emerald-400 font-bold shadow-md transform hover:-translate-y-1";
                } else {
                  bgStyle = "bg-gradient-to-br from-rose-50 to-orange-50 hover:from-rose-100 hover:to-orange-100 text-rose-950 border-2 border-rose-300 font-bold shadow-md transform hover:-translate-y-1";
                }
              }

              return (
                <button
                  key={cell.dateKey}
                  onClick={() => onSelectDate(cell.dateKey, hasRecord)}
                  className={`h-24 md:h-28 rounded-2xl p-3 flex flex-col justify-between text-left transition-all duration-200 relative cursor-pointer group ${bgStyle}`}
                >
                  <div className="flex items-start justify-between w-full">
                    <span className={`text-lg md:text-xl font-black ${hasRecord ? '' : 'text-stone-400'}`}>{cell.day}</span>
                    {hasRecord && (
                      <span className="text-lg bg-white/60 rounded-full w-6 h-6 flex items-center justify-center shadow-sm">
                        {isSuccess ? '🌱' : '⚠️'}
                      </span>
                    )}
                  </div>

                  <div className="text-right w-full">
                    {hasRecord ? (
                      <div>
                        <div className={`font-black text-lg md:text-xl tracking-tighter ${isSuccess ? 'text-emerald-700' : 'text-rose-600'}`}>
                           {isSuccess ? '-' : '+'}{Math.abs(deficit)}
                        </div>
                        <div className="text-[10px] font-bold opacity-60 uppercase tracking-wider mt-0.5">kcal</div>
                      </div>
                    ) : (
                      <div className="flex items-center justify-center w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 opacity-0 group-hover:opacity-100 transition-opacity ml-auto">
                        <span className="font-bold text-lg leading-none">+</span>
                      </div>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

                <span className="text-3xl bg-stone-50 p-2 rounded-2xl shadow-inner">{isSuccess ? '🟢' : '🟠'}</span>
                <div>

    // --- 11. 填寫 / 編輯記錄 Modal ---
    function RecordModal({ dateKey, initialRecord, userWeight, baseline, onClose, onSave }) {
      const [foods, setFoods] = useState(initialRecord?.foods || []);
      const [exercises, setExercises] = useState(initialRecord?.exercises || []);

      const [foodQty, setFoodQty] = useState('1');
      const [selectedDbFood, setSelectedDbFood] = useState(FOOD_DATABASE[0]);
      const [isCustomFood, setIsCustomFood] = useState(false);
      const [customFoodName, setCustomFoodName] = useState('');

      const foodCategories = [...new Set(FOOD_DATABASE.map(f => f.category))];
      const [selectedCategory, setSelectedCategory] = useState(foodCategories[0]);
      const filteredFoods = FOOD_DATABASE.filter(f => f.category === selectedCategory);
      
      useEffect(() => {
          if (filteredFoods.length > 0 && !filteredFoods.find(f => f.name === selectedDbFood.name)) {
              setSelectedDbFood(filteredFoods[0]);
          }
      }, [selectedCategory]);

      const exCategories = [...new Set(EXERCISE_METS.map(e => e.category))];
      const [selectedExCategory, setSelectedExCategory] = useState(exCategories[0]);
      const filteredExercises = EXERCISE_METS.filter(e => e.category === selectedExCategory);
      const [selectedExercise, setSelectedExercise] = useState(EXERCISE_METS[0]);
      const [exerciseMinutes, setExerciseMinutes] = useState('30');

      useEffect(() => {
          if (filteredExercises.length > 0 && !filteredExercises.find(e => e.name === selectedExercise.name)) {
              setSelectedExercise(filteredExercises[0]);
          }
      }, [selectedExCategory]);

      const handleDecimalChange = (val, setter) => {
        if (/^\d*\.?\d*$/.test(val)) setter(val);
      };

      const handleIntegerChange = (val, setter) => {
        if (/^\d*$/.test(val)) setter(val);
      };

      const handleAddFood = () => {
        const qtyNum = parseFloat(foodQty) || 1;
        if (isCustomFood) {
          if (!customFoodName.trim()) return;
          const estimatedKcal = estimateKcalFromName(customFoodName.trim());
          setFoods([...foods, {
            name: customFoodName.trim() + ' (估)',
            qty: qtyNum,
            unit: '份',
            kcalPerUnit: estimatedKcal,
            totalKcal: Math.round(estimatedKcal * qtyNum)
          }]);
          setCustomFoodName('');
        } else {
          setFoods([...foods, {
            name: selectedDbFood.name,
            qty: qtyNum,
            unit: selectedDbFood.unit,
            kcalPerUnit: selectedDbFood.kcal,
            totalKcal: Math.round(selectedDbFood.kcal * qtyNum)
          }]);
        }
        setFoodQty('1');
      };

      const handleRemoveFood = (idx) => {
        setFoods(foods.filter((_, i) => i !== idx));
      };

      const handleAddExercise = () => {
        const mins = parseInt(exerciseMinutes, 10) || 0;
        if (mins <= 0) return;
        const hours = mins / 60;
        const burnKcal = Math.round(selectedExercise.mets * (parseFloat(userWeight) || 60) * hours);

        setExercises([...exercises, {
          name: selectedExercise.name,
          minutes: mins,
          mets: selectedExercise.mets,
          burnKcal
        }]);
        setExerciseMinutes('30');
      };

      const handleRemoveExercise = (idx) => {
        setExercises(exercises.filter((_, i) => i !== idx));
      };

      const totalIntake = foods.reduce((sum, item) => sum + (parseFloat(item.totalKcal) || 0), 0);
      const totalBurn = exercises.reduce((sum, item) => sum + (parseFloat(item.burnKcal) || 0), 0);
      const deficit = Math.round((baseline + totalBurn) - totalIntake);

      const warningMsg = getWarningMessage(deficit);

      return (
        <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto py-10">
          <div className="bg-white rounded-[2rem] max-w-2xl w-full p-6 md:p-10 shadow-2xl border-4 border-emerald-100 my-auto">
            <div className="flex items-center justify-between pb-6 border-b-2 border-stone-100 mb-6">
              <div>
                <h3 className="font-extrabold text-stone-900 text-3xl mb-1">📝 紀錄收支</h3>
                <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-lg tracking-wider">
                  {dateKey}
                </span>
              </div>
              <button onClick={onClose} className="w-12 h-12 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-500 flex items-center justify-center font-bold text-xl transition-colors">✕</button>
            </div>

            {/* 飲食區塊 */}
            <div className="mb-8 bg-stone-50 p-6 rounded-3xl border border-stone-200">
              <div className="flex items-center justify-between mb-4">
                <span className="font-extrabold text-stone-800 text-lg flex items-center gap-2">
                  <span className="text-2xl">🥗</span> 飲食攝取 
                  <span className="text-rose-500 font-black ml-2 bg-rose-100 px-2 rounded-md">+{Math.round(totalIntake)}</span>
                </span>
                <button 
                  type="button"
                  onClick={() => setIsCustomFood(!isCustomFood)}
                  className="text-sm font-bold text-emerald-600 bg-emerald-100 hover:bg-emerald-200 px-3 py-1.5 rounded-xl transition-colors"
                >
                  {isCustomFood ? '📋 常用清單' : '✏️ 自訂餐點名稱'}
                </button>
              </div>

              {!isCustomFood ? (
                <div className="space-y-4 mb-2">
                  <div className="flex flex-wrap gap-2">
                    {foodCategories.map(cat => (
                       <button
                         key={cat}
                         onClick={() => setSelectedCategory(cat)}
                         className={`px-3 py-1.5 rounded-full text-xs md:text-sm font-bold border transition-colors ${
                             selectedCategory === cat ? 'bg-stone-800 text-white border-stone-800 shadow-sm' : 'bg-white text-stone-500 border-stone-200 hover:border-stone-400'
                         }`}
                       >
                         {cat}
                       </button>
                    ))}
                  </div>
                  <div className="flex flex-col sm:flex-row gap-3">
                    <select 
                      className="flex-1 px-4 py-3 border-2 border-stone-200 rounded-2xl text-base font-bold text-stone-700 focus:outline-none focus:border-emerald-500 bg-white shadow-sm"
                      onChange={(e) => {
                        const item = filteredFoods.find(f => f.name === e.target.value);
                        if (item) setSelectedDbFood(item);
                      }}
                      value={selectedDbFood.name}
                    >
                      {filteredFoods.map((item, idx) => (
                        <option key={idx} value={item.name}>
                          {item.name} ({item.kcal} kcal)
                        </option>
                      ))}
                    </select>
                    <div className="flex gap-2 w-full sm:w-auto">
                      <input 
                        type="text" 
                        value={foodQty}
                        placeholder="份量"
                        onChange={(e) => handleDecimalChange(e.target.value, setFoodQty)}
                        className="w-24 px-4 py-3 border-2 border-stone-200 rounded-2xl text-base font-bold text-center focus:outline-none focus:border-emerald-500 bg-white shadow-sm"
                      />
                      <button 
                        type="button" 
                        onClick={handleAddFood}
                        className="flex-1 sm:w-20 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-lg transition-colors shadow-md flex items-center justify-center"
                      >
                        +
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="flex flex-col sm:flex-row gap-3 mb-2">
                  <input 
                    type="text" 
                    value={customFoodName}
                    placeholder="輸入餐點名稱 (系統自動估算熱量)"
                    onChange={(e) => setCustomFoodName(e.target.value)}
                    className="flex-1 px-4 py-3 border-2 border-stone-200 rounded-2xl text-base font-bold text-stone-700 focus:outline-none focus:border-emerald-500 bg-white shadow-sm"
                  />
                  <div className="flex gap-2 w-full sm:w-auto">
                    <input 
                      type="text" 
                      value={foodQty}
                      placeholder="份量"
                      onChange={(e) => handleDecimalChange(e.target.value, setFoodQty)}
                      className="w-24 px-4 py-3 border-2 border-stone-200 rounded-2xl text-base font-bold text-center focus:outline-none focus:border-emerald-500 bg-white shadow-sm"
                    />
                    <button 
                      type="button" 
                      onClick={handleAddFood}
                      className="flex-1 sm:w-20 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-lg transition-colors shadow-md flex items-center justify-center"
                    >
                      +
                    </button>
                  </div>
                </div>
              )}
              
              <p className="text-[10px] text-stone-400 mb-3 ml-1 font-medium tracking-wide">💡 註：品項熱量參考自衛福部食藥署「台灣食品營養成分資料庫」</p>

              <div className="bg-white rounded-2xl p-4 border border-stone-200 shadow-inner max-h-40 overflow-y-auto">
                {foods.length === 0 ? (
                  <p className="text-stone-400 text-center py-4 font-bold text-sm">尚未新增食物</p>
                ) : (
                  <div className="space-y-2">
                      {foods.map((item, idx) => (
                        <div key={idx} className="flex justify-between items-center bg-stone-50 px-4 py-2.5 rounded-xl border border-stone-100 group hover:border-rose-200 transition-colors">
                          <span className="font-bold text-stone-700">{item.name} <span className="text-stone-400 text-xs ml-2 font-normal">× {item.qty} {item.unit || '份'}</span></span>
                          <div className="flex items-center gap-4">
                            <span className="font-black text-rose-500 text-lg">{item.totalKcal}</span>
                            <button onClick={() => handleRemoveFood(idx)} className="w-8 h-8 rounded-full bg-stone-200 hover:bg-rose-500 hover:text-white text-stone-500 flex items-center justify-center font-bold transition-colors">✕</button>
                          </div>
                        </div>
                      ))}
                  </div>
                )}
              </div>
            </div>

            {/* 運動區塊 */}
            <div className="mb-8 bg-stone-50 p-6 rounded-3xl border border-stone-200">
              <span className="font-extrabold text-stone-800 text-lg flex items-center gap-2 mb-4">
                <span className="text-2xl">🏃</span> 運動消耗
                <span className="text-emerald-600 font-black ml-2 bg-emerald-100 px-2 rounded-md">-{Math.round(totalBurn)}</span>
              </span>
              
              <div className="space-y-4 mb-2">
                <div className="flex flex-wrap gap-2">
                  {exCategories.map(cat => (
                     <button
                       key={cat}
                       onClick={() => setSelectedExCategory(cat)}
                       className={`px-3 py-1.5 rounded-full text-xs md:text-sm font-bold border transition-colors ${
                           selectedExCategory === cat ? 'bg-stone-800 text-white border-stone-800 shadow-sm' : 'bg-white text-stone-500 border-stone-200 hover:border-stone-400'
                       }`}
                     >
                       {cat}
                     </button>
                  ))}
                </div>
                <div className="flex flex-col sm:flex-row gap-3">
                  <select 
                    className="flex-1 px-4 py-3 border-2 border-stone-200 rounded-2xl text-base font-bold text-stone-700 focus:outline-none focus:border-emerald-500 bg-white shadow-sm"
                    onChange={(e) => {
                      const item = filteredExercises.find(m => m.name === e.target.value);
                      if (item) setSelectedExercise(item);
                    }}
                    value={selectedExercise.name}
                  >
                    {filteredExercises.map((item, idx) => (
                      <option key={idx} value={item.name}>
                        {item.name} (強度: {item.mets})
                      </option>
                    ))}
                  </select>
                  <div className="flex gap-2 w-full sm:w-auto">
                    <div className="relative">
                      <input 
                        type="text" 
                        value={exerciseMinutes}
                        placeholder="分鐘"
                        onChange={(e) => handleIntegerChange(e.target.value, setExerciseMinutes)}
                        className="w-24 px-4 py-3 border-2 border-stone-200 rounded-2xl text-base font-bold text-center focus:outline-none focus:border-emerald-500 bg-white shadow-sm pr-8"
                      />
                      <span className="absolute right-3 top-3.5 text-sm font-bold text-stone-400">m</span>
                    </div>
                    <button 
                      type="button" 
                      onClick={handleAddExercise}
                      className="flex-1 sm:w-20 bg-stone-800 hover:bg-black text-white rounded-2xl font-black text-lg transition-colors shadow-md flex items-center justify-center"
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>
              <p className="text-[10px] text-stone-400 mb-3 ml-1 font-medium tracking-wide">💡 註：消耗熱量依據國際通用的 代謝當量 (METs) 搭配您的體重計算</p>

              <div className="bg-white rounded-2xl p-4 border border-stone-200 shadow-inner max-h-32 overflow-y-auto">
                {exercises.length === 0 ? (
                  <p className="text-stone-400 text-center py-4 font-bold text-sm">尚未新增運動 (可略過)</p>
                ) : (
                  <div className="space-y-2">
                      {exercises.map((item, idx) => (
                        <div key={idx} className="flex justify-between items-center bg-emerald-50 px-4 py-2.5 rounded-xl border border-emerald-100 group hover:border-rose-200 transition-colors">
                          <span className="font-bold text-emerald-900">{item.name} <span className="text-emerald-600/70 text-xs ml-2 font-normal">{item.minutes} min</span></span>
                          <div className="flex items-center gap-4">
                            <span className="font-black text-emerald-600 text-lg">-{item.burnKcal}</span>
                            <button onClick={() => handleRemoveExercise(idx)} className="w-8 h-8 rounded-full bg-emerald-200/50 hover:bg-rose-500 hover:text-white text-emerald-700 flex items-center justify-center font-bold transition-colors">✕</button>
                          </div>
                        </div>
                      ))}
                  </div>
                )}
              </div>
            </div>

            {/* 即時試算儀表列 */}
            {warningMsg && (
              <div className={`mb-3 px-4 py-3 rounded-xl text-xs font-bold shadow-inner border ${warningMsg.type === 'deficit' ? 'bg-orange-100 text-orange-800 border-orange-300' : 'bg-rose-100 text-rose-800 border-rose-300'}`}>
                  {warningMsg.text}
              </div>
            )}
            
            <div className={`p-6 rounded-[2rem] mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border-2 transition-colors ${deficit >= 0 ? 'bg-brand-light border-brand-mint shadow-lg shadow-brand-mint/20' : 'bg-rose-50 border-rose-200 shadow-lg shadow-rose-200/50'}`}>
              <div className="text-sm font-black text-stone-600 bg-white/50 px-4 py-2 rounded-xl backdrop-blur-sm border border-stone-200/50">
                {baseline} <span className="text-xs text-stone-400 mx-1">基</span> + 
                {Math.round(totalBurn)} <span className="text-xs text-stone-400 mx-1">動</span> - 
                <span className="text-rose-500 ml-1">{Math.round(totalIntake)}</span> <span className="text-xs text-rose-300 mx-1">食</span>
              </div>
              <div className="flex flex-col items-center md:items-end">
                <span className="text-xs font-bold text-stone-500 uppercase tracking-widest mb-1">Total Result</span>
                <div className="flex items-baseline gap-1">
                    <span className={`text-5xl font-black tracking-tighter ${deficit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                    {deficit >= 0 ? '-' : '+'}{Math.abs(deficit)}
                    </span>
                    <span className="font-bold text-stone-400">kcal</span>
                </div>
              </div>
            </div>

            {/* 儲存按鈕 */}
            <div className="flex gap-4">
              <button 
                type="button" 
                onClick={onClose}
                className="w-1/3 py-4 rounded-2xl border-2 border-stone-200 text-stone-500 hover:bg-stone-50 text-lg font-bold transition-colors"
              >
                取消
              </button>
              <button 
                type="button" 
                onClick={() => onSave(foods, exercises)}
                className="w-2/3 py-4 rounded-2xl bg-stone-800 hover:bg-black text-white text-xl font-bold shadow-xl shadow-stone-800/20 transition-transform hover:-translate-y-1 flex items-center justify-center gap-2"
              >
                💾 儲存今日紀錄
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- 12. 更換大頭貼 Modal ---
    function AvatarEditModal({ currentProfile, onClose, onSave }) {
        const [avatarType, setAvatarType] = useState(
            (currentProfile.avatar && currentProfile.avatar.startsWith('data:image')) ? 'custom' : (currentProfile.avatar || 'sprout_1')
        );
        const [avatarImage, setAvatarImage] = useState(
             (currentProfile.avatar && currentProfile.avatar.startsWith('data:image')) ? currentProfile.avatar : null
        );
        const fileInputRef = useRef(null);

        const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    setAvatarImage(reader.result);
                    setAvatarType('custom');
                };
                reader.readAsDataURL(file);
            }
        };

        const handleSave = () => {
            let finalAvatar = avatarType;
            if (avatarType === 'custom' && avatarImage) {
                finalAvatar = avatarImage;
            } else if (avatarType === 'custom' && !avatarImage) {
                finalAvatar = 'sprout_1';
            }
            onSave({ ...currentProfile, avatar: finalAvatar });
        };

        return (
            <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div className="bg-white rounded-[2rem] max-w-sm w-full p-8 text-center shadow-2xl border-4 border-emerald-100">
                    <h3 className="text-2xl font-black text-stone-800 mb-6">更換大頭貼</h3>
                    
                    <div className="w-32 h-32 mx-auto rounded-full border-4 border-emerald-400 overflow-hidden bg-emerald-50 flex items-center justify-center mb-6 shadow-xl relative group">
                        {avatarType === 'custom' && avatarImage ? (
                            <img src={avatarImage} alt="Custom Avatar" className="w-full h-full object-cover" />
                        ) : (
                            <span className="text-6xl">{AVATAR_OPTIONS.find(a => a.id === avatarType)?.icon || '🌱'}</span>
                        )}
                    </div>

                    <div className="flex gap-3 mb-6 flex-wrap justify-center">
                        {AVATAR_OPTIONS.map(opt => (
                            <button
                                key={opt.id}
                                onClick={() => setAvatarType(opt.id)}
                                className={`w-14 h-14 rounded-full text-2xl border-2 flex items-center justify-center transition-all ${
                                    avatarType === opt.id ? 'border-emerald-500 bg-emerald-100 scale-110 shadow-md' : 'border-stone-200 bg-stone-50 hover:bg-stone-100'
                                }`}
                            >
                                {opt.icon}
                            </button>
                        ))}
                    </div>

                    <div className="mb-8">
                        <input 
                            type="file" 
                            accept="image/*" 
                            ref={fileInputRef}
                            onChange={handleImageUpload}
                            className="hidden" 
                        />
                        <button 
                            onClick={() => fileInputRef.current.click()}
                            className="w-full py-3 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl border border-stone-300 transition-colors flex items-center justify-center gap-2"
                        >
                            <span>📸 上傳自訂照片</span>
                        </button>
                    </div>

                    <div className="flex gap-3">
                      <button onClick={onClose} className="w-1/2 py-3 border-2 border-stone-200 text-stone-600 rounded-xl font-bold hover:bg-stone-50 transition-colors">
                        取消
                      </button>
                      <button onClick={handleSave} className="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-lg transition-colors">
                        確定更換
                      </button>
                    </div>
                </div>
            </div>
        );
    }

    // --- 13. 編輯個人資料 Modal ---
    function ProfileEditModal({ initialProfile, onClose, onSave }) {
      const [username, setUsername] = useState(initialProfile.username);
      const [gender, setGender] = useState(initialProfile.gender);
      const [birthday, setBirthday] = useState(initialProfile.birthday);
      const [height, setHeight] = useState(String(initialProfile.height));
      const [weight, setWeight] = useState(String(initialProfile.weight));
      const [activity, setActivity] = useState(initialProfile.activity);

      const handleSubmit = (e) => {
        e.preventDefault();
        const age = calcAge(birthday);
        const bmr = calcBMR(gender, weight, height, age);
        const actObj = ACTIVITY_LEVELS.find(a => a.id === activity) || ACTIVITY_LEVELS[0];
        const baseline = calcBaseline(bmr, actObj.factor);

        onSave({
          ...initialProfile,
          username: username.trim().slice(0, 10) || '綠寶好友',
          gender,
          birthday,
          age,
          height: parseFloat(height) || 165,
          weight: parseFloat(weight) || 60,
          activity,
          activityFactor: actObj.factor,
          bmr,
          baseline
        });
      };

      return (
        <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto py-10">
          <div className="bg-white rounded-[2rem] max-w-lg w-full p-8 md:p-10 shadow-2xl border-2 border-stone-100 my-auto">
            <div className="flex items-center justify-between pb-6 border-b-2 border-stone-100 mb-8">
              <h3 className="font-extrabold text-stone-900 text-2xl flex items-center gap-2">⚙️ 編輯設定</h3>
              <button onClick={onClose} className="w-10 h-10 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-500 flex items-center justify-center font-bold text-lg transition-colors">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-6">
              <div className="bg-stone-50 p-4 rounded-2xl">
                <label className="block text-sm font-bold text-stone-600 mb-2">暱稱 (最多10字)</label>
                <input 
                  type="text" 
                  maxLength={10}
                  value={username} 
                  onChange={(e) => setUsername(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-stone-200 rounded-xl text-lg font-bold focus:outline-none focus:border-emerald-500 bg-white"
                />
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div className="bg-stone-50 p-4 rounded-2xl">
                  <label className="block text-sm font-bold text-stone-600 mb-2">生理性別</label>
                  <select 
                    value={gender} 
                    onChange={(e) => setGender(e.target.value)}
                    className="w-full px-4 py-3 border-2 border-stone-200 rounded-xl text-lg font-bold focus:outline-none focus:border-emerald-500 bg-white"
                  >
                    <option value="female">🙋‍♀️ 女生</option>
                    <option value="male">🙋‍♂️ 男生</option>
                  </select>
                </div>
                <div className="bg-stone-50 p-4 rounded-2xl">
                  <label className="block text-sm font-bold text-stone-600 mb-2">出生年月日</label>
                  <input 
                    type="date" 
                    value={birthday} 
                    onChange={(e) => setBirthday(e.target.value)}
                    className="w-full px-3 py-3 border-2 border-stone-200 rounded-xl text-base font-bold focus:outline-none focus:border-emerald-500 bg-white"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <div className="bg-stone-50 p-4 rounded-2xl">
                  <label className="block text-sm font-bold text-stone-600 mb-2">身高 (cm)</label>
                  <input 
                    type="number" 
                    value={height} 
                    onChange={(e) => setHeight(e.target.value)}
                    className="w-full px-4 py-3 border-2 border-stone-200 rounded-xl text-lg font-bold focus:outline-none focus:border-emerald-500 bg-white"
                  />
                </div>
                <div className="bg-stone-50 p-4 rounded-2xl">
                  <label className="block text-sm font-bold text-stone-600 mb-2">體重 (kg)</label>
                  <input 
                    type="number" 
                    value={weight} 
                    onChange={(e) => setWeight(e.target.value)}
                    className="w-full px-4 py-3 border-2 border-stone-200 rounded-xl text-lg font-bold focus:outline-none focus:border-emerald-500 bg-white"
                  />
                </div>
              </div>

              <div className="bg-stone-50 p-4 rounded-2xl">
                <label className="block text-sm font-bold text-stone-600 mb-2">日常活動型態</label>
                <select 
                  value={activity} 
                  onChange={(e) => setActivity(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-stone-200 rounded-xl text-base font-bold focus:outline-none focus:border-emerald-500 bg-white"
                >
                  {ACTIVITY_LEVELS.map(a => (
                    <option key={a.id} value={a.id}>{a.emoji} {a.label} ({a.desc})</option>
                  ))}
                </select>
              </div>

              <div className="flex gap-4 pt-4 border-t-2 border-stone-100">
                <button 
                  type="button" 
                  onClick={onClose} 
                  className="w-1/3 py-4 border-2 border-stone-200 text-stone-600 rounded-2xl text-lg font-bold hover:bg-stone-50 transition-colors"
                >
                  取消
                </button>
                <button 
                  type="submit" 
                  className="w-2/3 py-4 bg-stone-800 hover:bg-black text-white rounded-2xl text-lg font-bold shadow-xl transition-colors"
                >
                  更新設定
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- 14. 重新出生孟婆湯確認視窗 ---
    function RebirthConfirmModal({ onClose, onConfirm }) {
      return (
        <div className="fixed inset-0 bg-stone-900/70 backdrop-blur-md flex items-center justify-center p-4 z-50">
          <div className="bg-stone-900 rounded-[2rem] max-w-sm w-full p-8 text-center shadow-2xl border border-stone-700">
            <div className="w-24 h-24 bg-stone-800 text-white border-2 border-stone-700 rounded-full flex items-center justify-center mx-auto mb-6 text-5xl shadow-inner">
              🍵
            </div>
            <h3 className="text-2xl font-black text-white mb-3">喝下孟婆湯？</h3>
            <p className="text-sm text-stone-400 leading-relaxed mb-8 font-medium">
              紀錄的心血將化為烏有。<br/>過去的點滴將被徹底遺忘，<br/>確定要開啟全新的人生旅程嗎？
            </p>
            <div className="flex flex-col gap-3">
              <button 
                onClick={onConfirm}
                className="w-full py-4 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl text-lg font-bold transition-all shadow-lg shadow-rose-900/50"
              >
                忘記一切，重新出生
              </button>
              <button 
                onClick={onClose}
                className="w-full py-3 text-stone-400 hover:text-white hover:bg-stone-800 rounded-xl text-sm font-bold transition-colors"
              >
                繼續前世記憶 (取消)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- 15. 單日刪除確認視窗 ---
    function DeleteConfirmModal({ dateKey, onClose, onConfirm }) {
      return (
        <div className="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-[2rem] max-w-sm w-full p-8 text-center shadow-2xl border-4 border-rose-100">
            <div className="w-20 h-20 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner border border-rose-100">
              🗑️
            </div>
            <h3 className="text-2xl font-black text-stone-900 mb-2">確定刪除？</h3>
            <p className="text-sm text-stone-500 mb-8 font-medium">
              刪除後，<strong className="text-rose-600">{dateKey}</strong> 的紀錄將永久移除，日期變回未填寫狀態。
            </p>
            <div className="flex gap-3">
              <button onClick={onClose} className="w-1/2 py-4 border-2 border-stone-200 hover:bg-stone-50 text-stone-600 rounded-2xl text-base font-bold transition-colors">
                取消
              </button>
              <button onClick={onConfirm} className="w-1/2 py-4 bg-rose-500 hover:bg-rose-600 text-white rounded-2xl text-base font-bold shadow-lg shadow-rose-200 transition-colors">
                確定刪除
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- 16. 公版 Error Dialog ---
    function GlobalErrorModal({ message }) {
      return (
        <div className="fixed inset-0 bg-stone-900/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-[2rem] max-w-sm w-full p-8 text-center shadow-2xl border-4 border-amber-200">
            <div className="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl border border-amber-100 shadow-inner">
              🩹
            </div>
            <h3 className="text-2xl font-black text-stone-900 mb-3">哎呀！遇到小阻礙</h3>
            <p className="text-sm text-stone-600 mb-8 leading-relaxed font-medium bg-amber-50 p-4 rounded-xl">
              {message || "系統發生未預期的狀況，請點擊下方按鈕重新整理嘗試。"}
            </p>
            <button 
              onClick={() => window.location.reload()}
              className="w-full py-4 bg-stone-800 hover:bg-black text-white rounded-2xl text-lg font-bold shadow-xl transition-colors"
            >
              重新整理並重試 🔄
            </button>
          </div>
        </div>
      );
    }

    // 啟動 React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
